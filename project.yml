name: Ginny

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    CLANG_ENABLE_MODULES: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Ginny:
    type: application
    platform: iOS
    sources:
      - path: Ginny
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ginny.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ginny
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - GinnyTests
      gatherCoverageData: true

  GinnyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GinnyTests
    dependencies:
      - target: Ginny
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ginny.tests
