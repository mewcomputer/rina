name: Ginny

options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  SwiftStreamingMarkdown:
    url: https://github.com/espeon/SwiftStreamingMarkdown.git
    branch: feature/character-streaming-and-width-fix

settings:
  base:
    SWIFT_VERSION: "6.0"
    CLANG_ENABLE_MODULES: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Ginny:
    type: application
    platform: iOS
    info:
      path: Ginny/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: Ginny
      - path: theme_manifest.json
        buildPhase: resources
    dependencies:
      - package: SwiftStreamingMarkdown
        product: SwiftStreamingMarkdown
    settings:
      base:
        DEVELOPMENT_TEAM: P2B3GABB6H
        PRODUCT_BUNDLE_IDENTIFIER: fm.teal.ginny
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - GinnyTests
      gatherCoverageData: true

  GinnyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GinnyTests
    dependencies:
      - target: Ginny
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ginny.tests
